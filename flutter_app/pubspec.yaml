name: printbridge_agent
description: PrintBridge desktop print agent.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  multicast_dns: ^0.3.3
  tray_manager: ^0.2.3
  window_manager: ^0.4.3
  launch_at_startup: ^0.3.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.svg
